<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>검정 아기 용 배·뒷다리 비교</title>
<style>
body{margin:0;padding:24px;font-family:"Apple SD Gothic Neo",sans-serif;background:#eef1e6;color:#314d42}
h1{font-size:24px;margin:0 0 6px}p{margin:0 0 18px;color:#5b6f61}
section{margin-bottom:28px}h2{font-size:17px;margin:0 0 10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
figure{margin:0;background:#fff;border-radius:16px;padding:8px}
img{width:100%;border-radius:10px;display:block}
figcaption{font-size:14px;font-weight:700;padding:6px 4px 0}
</style></head><body>
<h1>검정 아기 용 · 배와 뒷다리 붙음 수정 비교</h1>
<p>왼쪽은 수정 전, 오른쪽은 승인한 수정안의 비교 렌더예요. 걷는 일부 순간에는 두 무릎이 가까워질 수 있어요.</p>
<section><h2>1. 걷는 중 · 질문하신 각도</h2><div class="pair">
<figure><img src="flank-before-threequarter-0.4.png" alt="수정 전 아기 용의 앞쪽 걷기 모습"><figcaption>수정 전</figcaption></figure>
<figure><img src="flank-b-threequarter-0.4.png" alt="승인한 아기 용의 앞쪽 걷기 모습"><figcaption>승인한 수정안</figcaption></figure></div></section>
<section><h2>2. 걷는 중 · 낮은 옆 각도 (앞다리 ↔ 뒷다리 사이)</h2><div class="pair">
<figure><img src="flank-before-low-0.4.png" alt="수정 전 다리 사이가 좁은 걷기 모습"><figcaption>수정 전 · 다리 사이가 좁음</figcaption></figure>
<figure><img src="flank-b-low-0.4.png" alt="수정안의 배 아래 간격이 드러난 걷기 모습"><figcaption>승인한 수정안 · 배 아래 간격</figcaption></figure></div></section>
<section><h2>3. 서 있을 때 · 낮은 옆 각도</h2><div class="pair">
<figure><img src="idle-before-low-0.0.png" alt="수정 전 아기 용의 서 있는 모습"><figcaption>수정 전</figcaption></figure>
<figure><img src="idle-b-low-0.0.png" alt="승인한 아기 용의 서 있는 모습"><figcaption>승인한 수정안</figcaption></figure></div></section>
</body></html>
